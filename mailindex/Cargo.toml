[package]
name = "mailindex"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.4"
html-escape = "0.2"
html2text = "0.16"
mail-parser = "0.11"
pdf-extract = "0.12"
percent-encoding = "2"
rmcp = { version = "3.1.3", features = ["server", "client", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-streamable-http-client-reqwest"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.26.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["limit"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = { version = "0.8.0-pre.6", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
tower = "0.5"
